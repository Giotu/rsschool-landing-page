<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/images/logo.svg" />
    <script>
      const savedTheme = localStorage.getItem("theme");

      if (savedTheme) {
        document.documentElement.dataset.theme = savedTheme;
      }
    </script>
    <link rel="stylesheet" href="./src/css/main.css" />
    <script type="module" src="./src/js/menu.js"></script>
    <title>Coffee House</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header__inner">
          <a href="./index.html" class="header__logo">
            <svg class="icon-logo">
              <use href="./src/assets/images/sprite.svg#icon-logo"></use>
            </svg>
          </a>
          <nav class="navigation">
            <ul class="navigation__list">
              <li class="navigation__item">
                <a href="./index.html#favorite" class="navigation__link"
                  >Favorite coffee</a
                >
              </li>
              <li class="navigation__item">
                <a href="./index.html#about" class="navigation__link">About</a>
              </li>
              <li class="navigation__item">
                <a href="./index.html#mobile-app" class="navigation__link"
                  >Mobile app</a
                >
              </li>
              <li class="navigation__item">
                <a href="./index.html#contact" class="navigation__link"
                  >Contact us</a
                >
              </li>
            </ul>
          </nav>
          <div class="header__actions">
            <button
              class="theme-toggle"
              type="button"
              aria-label="Switch to dark theme"
            >
              <span
                class="theme-toggle__icon theme-toggle__icon--active theme-toggle__icon--sun"
              >
                <svg class="icon">
                  <use href="./src/assets/images/sprite.svg#icon-sun"></use>
                </svg>
              </span>

              <span class="theme-toggle__icon theme-toggle__icon--moon">
                <svg class="icon">
                  <use href="./src/assets/images/sprite.svg#icon-moon"></use>
                </svg>
              </span>
            </button>
            <a
              href="./menu.html"
              class="menu-link menu-link--desktop menu-link--active"
              ><span>Menu</span>
              <svg class="icon">
                <use
                  href="./src/assets/images/sprite.svg#icon-coffee-cup"
                ></use>
              </svg>
            </a>
            <button class="button-burger"></button>
          </div>
        </div>
      </div>
    </header>
    <main class="main">
      <div class="container">
        <section class="menu">
          <h2 class="menu__title">
            Behind each of our cups hides an
            <span class="accent">amazing surprise</span>
          </h2>
          <div class="menu__switch">
            <button
              class="button-switch button-switch--active"
              data-category="coffee"
            >
              <span class="button-image__wrapper">
                <img
                  src="./src/assets/images/switch-coffee.png"
                  alt="Coffee image"
                />
              </span>
              <span>Coffee</span>
            </button>
            <button class="button-switch" data-category="tea">
              <span class="button-image__wrapper">
                <img src="./src/assets/images/switch-tea.png" alt="Tea image" />
              </span>
              <span>Tea</span>
            </button>
            <button class="button-switch" data-category="dessert">
              <span class="button-image__wrapper">
                <img
                  src="./src/assets/images/switch-dessert.png"
                  alt="Dessert image"
                />
              </span>
              <span>Dessert</span>
            </button>
          </div>
          <ul class="card__list"></ul>
          <button class="round-button load-more">
            <svg class="icon">
              <use href="./src/assets/images/sprite.svg#icon-load-more"></use>
            </svg>
          </button>
        </section>
      </div>
    </main>
    <footer class="footer">
      <div class="container">
        <div class="footer__inner">
          <div class="social-media">
            <h2 class="social-media__title">
              Sip, Savor, Smile. <span class="accent"> It’s coffee time!</span>
            </h2>
            <ul class="social-media__list">
              <li class="social-media__item">
                <a
                  href="https://x.com/"
                  class="round-button social-media__link"
                >
                  <svg class="icon">
                    <use
                      href="./src/assets/images/sprite.svg#icon-twitter"
                    ></use>
                  </svg>
                </a>
              </li>
              <li class="social-media__item">
                <a
                  href="https://www.instagram.com/"
                  class="round-button social-media__link"
                >
                  <svg class="icon">
                    <use
                      href="./src/assets/images/sprite.svg#icon-instagram"
                    ></use>
                  </svg>
                </a>
              </li>
              <li class="social-media__item">
                <a
                  href="https://www.facebook.com/"
                  class="round-button social-media__link"
                >
                  <svg class="icon">
                    <use
                      href="./src/assets/images/sprite.svg#icon-facebook"
                    ></use>
                  </svg>
                </a>
              </li>
            </ul>
          </div>
          <div class="contacts">
            <h3 class="contacts__title">Contact us</h3>
            <ul class="contacts__list">
              <li class="contacts__item">
                <a
                  href="https://maps.app.goo.gl/T2qg6XeEYbVKSL4f6"
                  class="contacts__link"
                >
                  <svg class="icon">
                    <use href="./src/assets/images/sprite.svg#icon-map"></use>
                  </svg>
                  8558 Green Rd., LA
                </a>
              </li>
              <li class="contacts__item">
                <a href="tel:+16035550123" class="contacts__link">
                  <svg class="icon">
                    <use href="./src/assets/images/sprite.svg#icon-phone"></use>
                  </svg>
                  +1 (603) 555-0123
                </a>
              </li>
              <li class="contacts__item">
                <span class="contacts__link">
                  <svg class="icon">
                    <use href="./src/assets/images/sprite.svg#icon-time"></use>
                  </svg>
                  Mon–Sat: 9:00–23:00
                </span>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
